<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="グソクムシ育成">
<link rel="icon" type="image/png" href="assets/icon-180.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta property="og:title" content="グソクムシ育成">
<meta property="og:description" content="深い海で、のんびりいっしょに。オオグソクムシを育てるゲーム">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>グソクムシ育成</title>
<meta name="description" content="深い海で、のんびりいっしょに。オオグソクムシ育成ゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 深海の観察窓：全面キャンバスに、発光するガラスのHUDが浮かぶ（単一の深海ルック） */
:root{
  color-scheme: dark;
  --abyss:#040b1a;
  --trench:#0a2448;
  --glass:rgba(12,36,72,.62);
  --glass-hi:rgba(70,130,200,.26);
  --edge:rgba(140,222,255,.42);
  --glow:#8fe3ff;
  --ink:#eaf5ff;
  --mute:#9db3cf;
  --amber:#f6c760;
  --rose:#ff9fb8;
  --paper:#061428;
  --f-display:"Kiwi Maru","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-hand:"Klee One","Zen Maru Gothic",serif;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;color:var(--ink);font-family:var(--f-ui);
  background:radial-gradient(120% 80% at 50% 0%,var(--trench) 0%,var(--abyss) 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--abyss)}
#sea{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app button{touch-action:manipulation}
@supports (height:100dvh){html,body{height:100dvh}}

.glass{background:linear-gradient(180deg,var(--glass-hi),var(--glass));border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 16px rgba(90,190,255,.16),0 6px 18px rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ico svg,.ico img{display:block;width:100%;height:100%;object-fit:contain}
.ico img{transform:scale(1.12)}
.ico svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 4px rgba(143,227,255,.65))}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;transition:opacity .35s}
.hud>*{pointer-events:auto}
#app:not([data-started="1"]) .hud{opacity:0;pointer-events:none}
#app:not([data-started="1"]) .hud>*{pointer-events:none}
#app[data-mode="photo"] .hud,#app[data-mode="calm"] .hud{opacity:0}
#app[data-mode="photo"] .hud>*,#app[data-mode="calm"] .hud>*{pointer-events:none}

.top{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.status{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:44px;min-width:0}
.lvwrap{position:relative;width:58px;height:58px;flex:none;border-radius:50%;background:rgba(3,14,32,.7)}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5}
.ring-bg{stroke:rgba(255,255,255,.12)}
.ring-fg{stroke:var(--glow);stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke-dashoffset .6s;
  filter:drop-shadow(0 0 3px var(--glow))}
.lvtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvtext span{font-size:10px;letter-spacing:.06em;color:var(--mute)}
.lvtext b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9.5em}
.expbar{width:min(116px,26vw);height:7px;border-radius:7px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(140,222,255,.2)}
.expbar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#4fb8ec,var(--glow));transition:width .6s}
.stage{font-size:11px;color:var(--mute);white-space:nowrap}
.topright{display:flex;gap:8px;align-items:center;flex:none}
.coin{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 7px;border-radius:24px}
.coin .ico{width:26px;height:26px}
.coin .ico svg{filter:none;stroke:none}
.coin b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.iconbtn .ico{width:24px;height:24px}

.chips{position:absolute;top:82px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:5px;max-width:calc(100% - 92px)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1;padding:6px 9px;border-radius:20px;white-space:nowrap;
  background:rgba(4,16,36,.6);border:1px solid rgba(140,222,255,.2);color:#d6e8fb}
.chip .hrt{color:var(--rose)}
.chip b{font-weight:700;font-variant-numeric:tabular-nums}

.rail{position:absolute;top:82px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.railbtn{width:60px;height:62px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700}
.railbtn .ico{width:28px;height:28px}

.actions{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{height:86px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.04em;
  transition:transform .12s,box-shadow .2s,border-color .2s}
.act .ico{width:42px;height:42px;color:#f3ebff}
.act:active,.railbtn:active,.iconbtn:active{transform:scale(.95)}
.act.on{border-color:var(--glow);box-shadow:inset 0 0 18px rgba(143,227,255,.35),0 0 22px rgba(143,227,255,.45)}

/* その場のお知らせ */
.toast{position:absolute;left:50%;top:27%;transform:translate(-50%,8px);max-width:min(86%,420px);padding:10px 18px;border-radius:16px;
  font-size:14px;line-height:1.6;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  background:rgba(4,18,40,.82);border:1px solid var(--edge);box-shadow:0 0 18px rgba(90,190,255,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bar{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;border-radius:40px;white-space:nowrap;font-size:13px}
#hint{bottom:112px}
#calmBar{bottom:28px;flex-direction:column;gap:10px;padding:16px 22px;border-radius:22px;text-align:center}
#calmBar p{margin:0;font-family:var(--f-hand);font-size:16px;letter-spacing:.1em}
#calmBar b{font-family:var(--f-ui);font-variant-numeric:tabular-nums;margin-left:6px}
#photoBar{bottom:26px;padding:10px 14px;gap:22px}
.shutter{width:66px;height:66px;border-radius:50%;background:#f4fbff;box-shadow:0 0 0 4px rgba(4,18,40,.8),0 0 0 6px var(--glow),0 0 24px rgba(143,227,255,.6)}
.btn{height:40px;padding:0 18px;border-radius:22px;font-weight:700;font-size:14px;background:rgba(143,227,255,.14);border:1px solid var(--edge)}
.btn.primary{background:linear-gradient(180deg,#c7f3ff,#6fd0f5);color:#04223c;border-color:transparent;box-shadow:0 0 18px rgba(111,208,245,.5)}
.btn.warn{background:rgba(255,120,150,.18);border-color:rgba(255,160,180,.6)}
.btn:disabled{opacity:.4;cursor:default}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

/* シート */
.scrim{position:absolute;inset:0;background:rgba(0,6,16,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;display:flex;flex-direction:column;border-radius:24px 24px 0 0;
  background:linear-gradient(180deg,rgba(14,40,78,.97),rgba(5,16,34,.98));border-top:1px solid var(--edge);
  box-shadow:0 -10px 40px rgba(0,0,0,.5),0 -1px 18px rgba(90,190,255,.25);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.06em;color:#f0f8ff;text-shadow:0 0 12px rgba(143,227,255,.5)}
.sheet .x{width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;background:rgba(255,255,255,.08)}
.sheet-body{overflow:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  user-select:text;-webkit-user-select:text;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lead{margin:2px 0 14px;font-size:13px;line-height:1.7;color:var(--mute)}
.foodgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(140,222,255,.22)}
.foodcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;text-align:center}
.foodcard .fimg{width:72px;height:54px}
.foodcard .fimg svg,.foodcard .fimg img{width:100%;height:100%;object-fit:contain;display:block}
.foodcard b{font-size:15px}
.foodcard small{font-size:12px;color:var(--mute)}
.foodcard:disabled{opacity:.4}
.state{margin:14px 0 0;font-size:13px;text-align:center;color:#cfe4f8}
.tabs{display:flex;gap:6px;margin:4px 0 14px;padding:4px;border-radius:24px;background:rgba(0,0,0,.25);width:max-content}
.tabs button{height:32px;padding:0 16px;border-radius:18px;font-size:13px;font-weight:700;color:var(--mute)}
.tabs button[aria-selected="true"]{background:rgba(143,227,255,.18);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.zcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 10px;text-align:center;min-width:0}
.zcard canvas{width:100%;max-width:110px;aspect-ratio:11/7;display:block}
.zcard b{font-size:12px}
.zcard small{font-size:10.5px;color:var(--mute);line-height:1.4}
.zcard.sel{border-color:var(--glow);box-shadow:inset 0 0 14px rgba(143,227,255,.25)}
.zcard:disabled{cursor:default}
.tri{padding:12px 14px;margin-bottom:10px}
.tri h3{margin:0 0 4px;font-size:14px;color:#f0f8ff}
.tri p{margin:0;font-size:13px;line-height:1.75;color:#c9dcf0}
.tri.lock h3{color:var(--mute)}
.drow{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:10px;margin-bottom:10px}
.drow canvas{width:96px;height:64px;border-radius:10px;display:block}
.drow b{display:block;font-size:14px}
.drow small{display:block;font-size:12px;line-height:1.5;color:var(--mute);margin-top:2px}
.drow .btn{height:36px;padding:0 14px;font-size:13px}
.field{margin-bottom:18px}
.field label,.field .lab{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{height:42px;flex:1;min-width:0;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.3);color:var(--ink);font:inherit;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0}
.stats div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.stats dt{font-size:11px;color:var(--mute)}
.stats dd{margin:2px 0 0;font-size:17px;font-variant-numeric:tabular-nums}
.photo{margin:0;text-align:center}
.photo img{width:100%;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.photo figcaption{margin-top:10px;font-size:12px;color:var(--mute)}
.coinmark{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:var(--amber);vertical-align:-.08em;margin-right:3px;box-shadow:inset 0 -2px 0 rgba(160,100,10,.5)}

/* タイトル */
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  padding:9vh max(20px,env(safe-area-inset-right,0px)) 22px max(20px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(3,10,24,.55) 0%,rgba(3,10,24,0) 38%,rgba(3,10,24,0) 58%,rgba(3,10,24,.8) 100%);transition:opacity .6s}
.title.hide{opacity:0;pointer-events:none}
.logoblock{position:relative;text-align:center;width:100%}
.logo{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(38px,11.4vw,62px);letter-spacing:.03em;line-height:1.15;color:#f2fbff;
  -webkit-text-stroke:1px rgba(170,235,255,.45);text-wrap:balance;
  text-shadow:0 0 6px rgba(143,227,255,.9),0 0 22px rgba(80,180,255,.7),0 0 50px rgba(60,140,255,.45)}
.logo.img{text-shadow:none;-webkit-text-stroke:0;line-height:0}
.logo img{display:block;width:min(94%,520px);height:auto;margin:0 auto;filter:drop-shadow(0 6px 24px rgba(40,140,255,.35))}
.sub{margin:10px 0 0;font-family:var(--f-hand);font-size:clamp(14px,4vw,17px);letter-spacing:.22em;color:#d4ecff;text-shadow:0 0 10px rgba(80,180,255,.6)}
.note{position:absolute;font-family:var(--f-hand);font-size:13px;line-height:1.9;color:rgba(220,240,255,.85);text-align:left;white-space:nowrap}
.note.n1{left:2%;top:calc(100% + 26px);transform:rotate(-6deg)}
.note.n2{right:2%;top:calc(100% + 64px);transform:rotate(5deg);text-align:right}
.startcard{width:min(100%,380px);display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px}
.startcard p{margin:0;font-size:13px;color:var(--mute);text-align:center;line-height:1.6}
.startcard .btn{height:52px;border-radius:26px;font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:.1em}
.linkbtn{font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;align-self:center;padding:4px}

.veil{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 80% at 50% 0%,var(--trench) 0%,var(--abyss) 70%);transition:opacity .6s}
.veil.off{opacity:0;pointer-events:none}
.veil p{margin:0;font-family:var(--f-hand);font-size:15px;letter-spacing:.18em;color:#cfe8ff}
.veil-bubbles{display:flex;gap:12px;align-items:flex-end;height:40px}
.veil-bubbles i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(190,235,255,.8);box-shadow:0 0 10px rgba(143,227,255,.6);animation:rise 1.6s ease-in-out infinite}
.veil-bubbles i:nth-child(2){animation-delay:.25s;width:9px;height:9px}
.veil-bubbles i:nth-child(3){animation-delay:.5s;width:14px;height:14px}
@keyframes rise{0%,100%{transform:translateY(8px);opacity:.4}50%{transform:translateY(-14px);opacity:1}}
@media (max-height:640px){
  .act{height:70px}.act .ico{width:30px;height:30px}
  .railbtn{height:54px;width:54px}
  #hint{bottom:94px}
}
@media (prefers-reduced-motion:reduce){
  .toast,.sheet,.title,.hud,.veil{transition:none}
  .veil-bubbles i{animation:none}
}
</style>

<div id="app" data-mode="normal">
  <canvas id="sea" aria-label="深海の水そう"></canvas>

  <div class="hud" id="hud">
    <header class="top">
      <div class="status glass">
        <div class="lvwrap">
          <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-bg" cx="32" cy="32" r="26"/><circle class="ring-fg" id="ringFg" cx="32" cy="32" r="26"/></svg>
          <div class="lvtext"><span>Lv.</span><b id="lvNum">1</b></div>
        </div>
        <div class="meta">
          <div class="name" id="nameLbl">ぐそくん</div>
          <div class="expbar" aria-hidden="true"><i id="expFill"></i></div>
          <div class="stage" id="stageLbl">ちいさな幼体</div>
        </div>
      </div>
      <div class="topright">
        <div class="coin glass" aria-label="コイン"><span class="ico" data-asset="ui_coin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f6c760"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c4901f" stroke-width="1.4"/><path d="M8.5 13.2c1.6-2.6 5.2-2.6 7 0-1.8 1.3-5.4 1.3-7 0z" fill="#c4901f"/></svg></span><b id="coinNum">0</b></div>
        <button class="iconbtn glass" id="btnSettings" aria-label="せってい"><span class="ico" data-asset="ui_settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span></button>
      </div>
    </header>

    <div class="chips" aria-live="polite">
      <span class="chip"><span class="hrt">♥</span>なつき <b id="affNum">0</b></span>
      <span class="chip" id="chipFast">ごはん まだ</span>
      <span class="chip" id="chipMood">のんびり</span>
    </div>

    <nav class="rail" aria-label="メニュー">
      <button class="railbtn glass" id="btnZukan"><span class="ico" data-asset="ui_zukan"><svg viewBox="0 0 24 24"><path d="M3 5.5c2.5-1 5.5-1 9 .5 3.5-1.5 6.5-1.5 9-.5V19c-2.5-1-5.5-1-9 .5-3.5-1.5-6.5-1.5-9-.5z"/><path d="M12 6v13.5"/></svg></span>ずかん</button>
      <button class="railbtn glass" id="btnCamera"><span class="ico" data-asset="ui_camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></span>カメラ</button>

(() => {
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app'), cv = $('#sea'), cx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 定数 ---------- */
const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;

const tintCache = {};
function tinted(img, key){
  if (!TINT[key]) return img;

  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  TINT[key].forEach(([op, col]) => { x.globalCompositeOperation = op; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); });
  x.globalCompositeOperation = 'destination-in'; x.drawImage(img, 0, 0);
  return tintCache[id] = c;
}

/* ---------- 小さな道具 ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const uid = () => Math.random().toString(36).slice(2, 9);
function rr(c, x, y, w, h, r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function lvOf(exp){let lv=1,need=60,e=exp;while(e>=need&&lv<30){e-=need;lv++;need=60+lv*20}return{lv,cur:Math.min(e,need),need}}
function stageFor(lv){let s=0;STAGE_LV.forEach((l,i)=>{if(lv>=l)s=i});return s}
function fmtDur(ms){if(ms<HOUR)return Math.max(1,Math.round(ms/MIN))+'分';if(ms<DAY)return Math.round(ms/HOUR)+'時間';return Math.floor(ms/DAY)+'日'}

/* ---------- 画像素材（assets/ に置くと自動で差し替わる） ---------- */
const ASSETS = ['bg_sea','gusoku_1','gusoku_2','gusoku_3','gusoku_4','gusoku_5','gusoku_shell','jelly',
  'decor_cave','decor_coral','decor_lantern','decor_whalebone','decor_chimney','decor_ship',
  'food_saba','food_ika','food_ebi','food_deep',
  'ui_feed','ui_clean','ui_pet','ui_calm','ui_zukan','ui_camera','ui_sumika','ui_settings','ui_coin','logo'];
const IMG = {};
function loadAssets(){
  ASSETS.forEach(n => {
    const exts = ['webp', 'png'], im = new Image(); let i = 0;
    im.onload = () => { IMG[n] = im; assetReady(n); keyDone(n); };
    im.onerror = () => { if (++i < exts.length) im.src = 'assets/' + n + '.' + exts[i]; else keyDone(n); };
    im.src = 'assets/' + n + '.' + exts[0];
  });
}

const FOOD_PATHS = {};
for (const k in FOOD_SHAPES) FOOD_PATHS[k] = FOOD_SHAPES[k].map(p => Object.assign({}, p, {p: new Path2D(p.d)}));

/* ---------- 状態 ---------- */
function mkDirt(x, d){ return {id:uid(), x: x ?? rnd(0.12, 0.88), d: d ?? rnd(0.05, 1), hp:3, rub:0}; }
function fresh(name){

}
function loadSave(){ try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save(){ if (!started) return; st.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) {} }

const g = {x:0.58, d:0.5, dir:-1, mode:'idle', tx:0.5, td:0.5, timer:1.5, walk:0, moving:0, bubble:null,

/* ---------- 画面サイズと背景 ---------- */
let W = 0, H = 0, DPR = 1, K = 1, horizonY = 0, groundY = 0, DR = 0;
let bgC = null, decorC = null, vigC = null, caveHole = null;
const DPOS = {}, DANCH = {};
function mkCanvas(){ const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); const x = c.getContext('2d'); x.scale(DPR, DPR); return [c, x]; }

function resize(){
  const r = app.getBoundingClientRect();
  W = Math.max(280, r.width); H = Math.max(420, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  K = clamp(Math.min(W / 390, H / 780), 0.7, 1.5);
  horizonY = H * 0.55; groundY = Math.min(H * 0.7, H - 180); DR = H * 0.06;
  const art = !!IMG.bg_sea;

  DPOS.ship      = {x:W * 0.75, y:horizonY + H * 0.045, s:W * (art ? 0.2 : 0.25)};
  DPOS.whalebone = {x:W * 0.43, y:horizonY + H * 0.065, s:W * (art ? 0.15 : 0.19)};
  DPOS.cave      = {x:W * 0.2,  y:groundY + H * 0.004,  s:W * 0.23};
  DPOS.coral     = {x:W * 0.88, y:groundY + DR * 0.7,   s:W * 0.12};
  DPOS.lantern   = {x:W * 0.66, y:groundY + DR * 0.1,   s:W * 0.032};
  buildBG(); buildDecor(); buildVig(); seedAmbient();
}

function buildBG(){
  if (!W) return;
  let c; [bgC, c] = mkCanvas();
  if (IMG.bg_sea) { coverImg(c, IMG.bg_sea); return; }
  const R = mulberry32(7);
  let gr = c.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#0d3769'); gr.addColorStop(0.32, '#09264b'); gr.addColorStop(0.6, '#061731'); gr.addColorStop(1, '#030a16');
  c.fillStyle = gr; c.fillRect(0, 0, W, H);
  gr = c.createRadialGradient(W * 0.55, -H * 0.05, 0, W * 0.55, -H * 0.05, H * 0.65);
  gr.addColorStop(0, 'rgba(110,190,255,.32)'); gr.addColorStop(1, 'rgba(110,190,255,0)');
  c.fillStyle = gr; c.fillRect(0, 0, W, H);
  // 遠くの岩の塔
  [[0.08, 0.30, 0.025], [0.34, 0.22, 0.02], [0.62, 0.34, 0.03], [0.9, 0.26, 0.022]].forEach(([x, h, w]) =>
    spire(c, R, W * x, horizonY + H * 0.02, H * h, W * w, '#123462', '#0b2346'));
  rockLayer(c, R, horizonY - H * 0.01, H * 0.17, '#0f2d55', '#0a2141');
  rockLayer(c, R, horizonY + H * 0.03, H * 0.1, '#0a1e3c', '#071630');
  // 海底
  c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) c.lineTo(x, horizonY + H * 0.04 + Math.sin(x * 0.018) * 3 * K + Math.sin(x * 0.051) * 2 * K);
  c.lineTo(W, H); c.closePath();
  gr = c.createLinearGradient(0, horizonY, 0, H);
  gr.addColorStop(0, '#1d375e'); gr.addColorStop(0.35, '#152b4f'); gr.addColorStop(1, '#091630');
  c.fillStyle = gr; c.fill();
  c.save(); c.translate(W * 0.52, groundY + DR * 0.4); c.scale(1, 0.24);
  gr = c.createRadialGradient(0, 0, 0, 0, 0, W * 0.62);
  gr.addColorStop(0, 'rgba(140,190,245,.32)'); gr.addColorStop(1, 'rgba(140,190,245,0)');
  c.fillStyle = gr; c.fillRect(-W, -W, W * 2, W * 2); c.restore();
  for (let i = 0; i < 700; i++) {
    const y = lerp(horizonY + H * 0.05, H, Math.pow(R(), 0.8)), x = R() * W, r = (0.4 + R() * 1.2) * K * (0.6 + (y - horizonY) / H);
    c.fillStyle = R() < 0.55 ? `rgba(190,215,255,${0.06 + R() * 0.14})` : `rgba(0,6,20,${0.15 + R() * 0.2})`;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  for (let i = 0; i < 16; i++) {
    const y = lerp(horizonY + H * 0.06, H * 0.98, R()), x = R() * W, s = (3 + R() * 9) * K * (0.5 + (y - horizonY) / H);
    c.fillStyle = '#0a1830'; c.beginPath(); c.ellipse(x, y, s * 1.4, s * 0.7, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(120,160,215,.22)'; c.beginPath(); c.ellipse(x - s * 0.3, y - s * 0.3, s * 0.7, s * 0.25, 0, 0, 7); c.fill();
  }
}
function coverImg(c, im){
  const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
  c.drawImage(im, (W - w) / 2, (H - h) * 0.5, w, h);

function rockLayer(c, R, base, amp, c1, c2){
  const n = 20, pts = [];
  for (let i = 0; i <= n; i++) pts.push([-20 + (W + 40) * i / n, base - amp * (0.2 + 0.8 * Math.pow(R(), 1.4))]);
  c.beginPath(); c.moveTo(-20, H); c.lineTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= n; i++) { const [px, py] = pts[i - 1], [x, y] = pts[i]; c.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2); }
  c.lineTo(W + 20, pts[n][1]); c.lineTo(W + 20, H); c.closePath();
  const gr = c.createLinearGradient(0, base - amp, 0, base + amp * 0.6);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2); c.fillStyle = gr; c.fill();
  c.save(); c.clip(); c.strokeStyle = 'rgba(130,190,255,.12)'; c.lineWidth = 2; c.stroke(); c.restore();
}
function spire(c, R, x, base, h, w, c1, c2){
  const steps = 7; c.beginPath(); c.moveTo(x - w, base);
  for (let i = 1; i <= steps; i++) { const t = i / steps; c.lineTo(x - w * (1 - t * 0.72) * (0.82 + R() * 0.36), base - h * t); }
  c.lineTo(x + w * 0.12, base - h * 1.03);
  for (let i = steps; i >= 0; i--) { const t = i / steps; c.lineTo(x + w * (1 - t * 0.7) * (0.82 + R() * 0.36), base - h * t); }
  c.closePath();
  const gr = c.createLinearGradient(x - w, 0, x + w, 0); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  c.fillStyle = gr; c.fill();
  c.strokeStyle = 'rgba(140,190,255,.10)'; c.lineWidth = 1; c.stroke();
}
function buildVig(){
  let c; [vigC, c] = mkCanvas();

const DIMG_W = {cave:2.6, coral:2, lantern:3.2, whalebone:2.5, chimney:2.1, ship:2.5};
// 画像の下の端（と左右の端）をぼかして、海底になじませる量
const DFADE = {cave:[0.12, 0.06], coral:[0.08, 0], lantern:[0.05, 0], whalebone:[0.26, 0.08], chimney:[0.12, 0.04], ship:[0.2, 0.05]};
const fadeCache = {};
function fadedDecor(id, img){
  const k = id + '|' + img.src; if (fadeCache[k]) return fadeCache[k];
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'), [fb, fs] = DFADE[id] || [0.08, 0];
  x.drawImage(img, 0, 0); x.globalCompositeOperation = 'destination-in';
  let gr = x.createLinearGradient(0, 0, 0, c.height);
  gr.addColorStop(0, '#000'); gr.addColorStop(1 - fb, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
  if (fs) {
    gr = x.createLinearGradient(0, 0, c.width, 0);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(fs, '#000'); gr.addColorStop(1 - fs, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
  }
  return fadeCache[k] = c;
}
// ぬけがら画像の 後ろ半分／前半分（切れ目をぼかす）
function shellHalf(part){
  const img = IMG.gusoku_shell, k = 'shell|' + part + '|' + img.src; if (fadeCache[k]) return fadeCache[k];
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'destination-in';
  const gr = x.createLinearGradient(0, 0, c.width, 0);

  else { gr.addColorStop(0.4, 'rgba(0,0,0,0)'); gr.addColorStop(0.54, '#000'); gr.addColorStop(1, '#000'); }
  x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
  return fadeCache[k] = c;
}
function buildDecor(){
  if (!W) return;

function drawDecor(c, id, x, y, s, world){
  const im = IMG['decor_' + id];

function drawCave(c, x, y, s, world){
  const R = mulberry32(11);
  c.save();
  c.beginPath();
  for (let i = 0; i <= 28; i++) {
    const a = Math.PI * i / 28, r = s * (1 + 0.1 * Math.sin(a * 6 + 1) + (R() - 0.5) * 0.12);
    const px = x + Math.cos(a) * r * 1.2, py = y - Math.sin(a) * r * 0.8;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  let gr = c.createLinearGradient(x - s, y - s * 0.8, x + s * 0.7, y);
  gr.addColorStop(0, '#2c4469'); gr.addColorStop(0.5, '#172b49'); gr.addColorStop(1, '#0a1529');
  c.fillStyle = gr; c.fill();
  c.save(); c.clip();
  for (let i = 0; i < 16; i++) {
    const lx = x + (R() - 0.5) * 2.3 * s, ly = y - R() * 0.85 * s, lr = s * (0.08 + R() * 0.17);
    const lg = c.createRadialGradient(lx - lr * 0.3, ly - lr * 0.4, 0, lx, ly, lr);
    lg.addColorStop(0, 'rgba(130,175,230,.22)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = lg; c.beginPath(); c.arc(lx, ly, lr, 0, 7); c.fill();
    c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.arc(lx + lr * 0.25, ly + lr * 0.35, lr * 0.5, 0, 7); c.fill();
  }
  c.restore();
  c.strokeStyle = 'rgba(150,200,255,.2)'; c.lineWidth = 1.5; c.stroke();
  const hx = x + s * 0.12, rx = s * 0.42, ry = s * 0.36;
  c.beginPath(); c.ellipse(hx, y, rx, ry, 0, Math.PI, Math.PI * 2); c.closePath();
  gr = c.createRadialGradient(hx, y - ry * 0.25, 0, hx, y, rx);
  gr.addColorStop(0, '#010309'); gr.addColorStop(0.75, '#040b18'); gr.addColorStop(1, '#0d1a33');
  c.fillStyle = gr; c.fill();
  c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 3; c.stroke();
  for (let i = 0; i < 5; i++) {
    const bx = x + (R() - 0.5) * 2.6 * s, br = s * (0.06 + R() * 0.08);
    c.fillStyle = '#0f1e38'; c.beginPath(); c.ellipse(bx, y, br * 1.3, br * 0.8, 0, Math.PI, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(140,180,230,.2)'; c.beginPath(); c.ellipse(bx - br * 0.3, y - br * 0.5, br * 0.6, br * 0.2, 0, 0, 7); c.fill();
  }
  c.restore();
  if (world) caveHole = {x:hx, y, rx, ry};
}
function drawCoral(c, x, y, s){
  const R = mulberry32(23);
  const br = (x0, y0, a, len, w, dep, col) => {
    const x2 = x0 + Math.cos(a) * len, y2 = y0 + Math.sin(a) * len;
    c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0);
    c.quadraticCurveTo(x0 + Math.cos(a + 0.3) * len * 0.5, y0 + Math.sin(a + 0.3) * len * 0.5, x2, y2); c.stroke();
    if (dep > 0) {
      br(x2, y2, a - 0.32 - R() * 0.32, len * 0.74, w * 0.7, dep - 1, col);
      br(x2, y2, a + 0.28 + R() * 0.32, len * 0.7, w * 0.7, dep - 1, col);
      if (R() < 0.35) br(x2, y2, a + (R() - 0.5) * 0.2, len * 0.6, w * 0.6, dep - 1, col);
    } else { c.fillStyle = col; c.beginPath(); c.arc(x2, y2, w * 1.2, 0, 7); c.fill(); }
  };
  c.save(); c.lineCap = 'round';
  c.shadowColor = 'rgba(255,90,150,.8)'; c.shadowBlur = 10;
  br(x - s * 0.6, y + s * 0.04, -Math.PI / 2 + 0.25, s * 0.42, s * 0.06, 3, '#ff6f9f');
  c.shadowColor = 'rgba(150,220,255,.85)';
  br(x, y, -Math.PI / 2 - 0.08, s * 0.56, s * 0.09, 4, '#e6f2ff');
  c.restore();
}
function drawLantern(c, x, y, s, world){
  c.save();

  rr(c, x - w * 0.6, y - h, w * 1.2, h, w * 0.4);
  c.fillStyle = 'rgba(190,225,255,.14)'; c.fill();
  c.strokeStyle = 'rgba(205,235,255,.6)'; c.lineWidth = Math.max(1, s * 0.08); c.stroke();
  c.fillStyle = '#3d4d68'; rr(c, x - w * 0.48, y - h - w * 0.28, w * 0.96, w * 0.32, w * 0.1); c.fill();
  c.strokeStyle = '#5d6f90'; c.lineWidth = Math.max(1, s * 0.09);
  c.beginPath(); c.arc(x, y - h - w * 0.28, w * 0.42, Math.PI, 0); c.stroke();

function drawWhalebone(c, x, y, s){
  c.save(); c.lineCap = 'round';
  const b1 = '#c9ced8', b2 = '#7c8496';
  for (let i = 0; i < 5; i++) {
    const bx = x - s * 0.75 + i * s * 0.33, k = Math.abs(i - 2);
    c.beginPath(); c.moveTo(bx, y - s * 0.05);
    c.bezierCurveTo(bx - s * 0.1, y - s * (0.6 - 0.06 * k), bx + s * 0.36, y - s * (0.7 - 0.07 * k), bx + s * 0.4, y + s * 0.02);
    c.strokeStyle = b2; c.lineWidth = s * 0.075; c.stroke();
    c.strokeStyle = b1; c.lineWidth = s * 0.04; c.stroke();
  }
  for (let i = 0; i < 8; i++) {
    const vx = x - s * 0.95 + i * s * 0.27, vy = y - s * 0.03 + Math.sin(i * 0.7) * s * 0.02;
    const gr = c.createLinearGradient(0, vy - s * 0.07, 0, vy + s * 0.07); gr.addColorStop(0, b1); gr.addColorStop(1, b2);
    c.fillStyle = gr; c.beginPath(); c.ellipse(vx, vy, s * 0.12, s * 0.075, 0, 0, 7); c.fill();
    c.strokeStyle = 'rgba(40,40,60,.4)'; c.lineWidth = 1; c.stroke();
  }
  c.fillStyle = 'rgba(24,44,78,.92)'; c.beginPath(); c.ellipse(x, y + s * 0.06, s * 1.3, s * 0.13, 0, 0, 7); c.fill();

}
function drawChimney(c, x, y, s, world){

    c.strokeStyle = 'rgba(150,180,220,.12)'; c.lineWidth = 1;
    for (let j = 1; j < 5; j++) { const yy = y - hh * j / 5; c.beginPath(); c.moveTo(bx - ww * 0.6 * (1 - j / 6), yy); c.lineTo(bx + ww * 0.5 * (1 - j / 6), yy + 2); c.stroke(); }

function drawShip(c, x, y, s, world){

  const W2 = (px, py) => ({x:x + px * cs - py * sn, y:y + px * sn + py * cs});

  c.beginPath(); c.moveTo(-s * 1.1, -s * 0.05); c.lineTo(-s * 1.0, -s * 0.46); c.lineTo(s * 0.9, -s * 0.5);
  c.quadraticCurveTo(s * 1.18, -s * 0.46, s * 1.06, -s * 0.05); c.closePath();

  c.fillStyle = gr; c.fill(); c.strokeStyle = 'rgba(130,180,240,.28)'; c.lineWidth = 1.2; c.stroke();
  c.strokeStyle = 'rgba(130,180,240,.15)'; c.beginPath(); c.moveTo(-s * 1.02, -s * 0.36); c.lineTo(s * 0.98, -s * 0.4); c.stroke();
  gr = c.createLinearGradient(0, -s * 0.8, 0, -s * 0.48); gr.addColorStop(0, '#1d3050'); gr.addColorStop(1, '#0e1a2f');
  c.fillStyle = gr; c.fillRect(-s * 0.55, -s * 0.8, s * 0.62, s * 0.32);

  c.strokeStyle = '#1b2c48'; c.lineWidth = s * 0.05; c.lineCap = 'round';
  c.beginPath(); c.moveTo(s * 0.35, -s * 0.5); c.lineTo(s * 0.46, -s * 1.3); c.stroke();
  c.lineWidth = s * 0.03; c.beginPath(); c.moveTo(s * 0.45, -s * 1.12); c.lineTo(s * 0.86, -s * 0.92); c.stroke();
  const ports = [];

    const px = -s * 0.8 + i * s * 0.28, py = -s * 0.24;

    c.strokeStyle = '#2e4366'; c.lineWidth = 1.2; c.stroke();

  if (world) DANCH.ship = ports.map(p => ({x:p.x, y:p.y, r:s * 0.05}));
  else ports.forEach(p => warmDot(c, p.x, p.y, s * 0.05, 1));
}
function lanternGlow(c, x, y, r, f, img){

/* ---------- グソクムシの絵（コードで描く仮の絵） ---------- */

function drawLobes(c, G, L, p){

function drawHead(c, G, L, p, o){

function drawEye(c, G, L, p, o){

function drawAntenna(c, G, L, o, far){

function drawLegs(c, G, L, o, far){
  const p = o.pal, mv = o.shell ? 0 : (o.moving || 0);

  for (let i = 0; i < 7; i++) {
    const u = LEG_U[i];
    const hx = G.X(u) + (far ? 0.018 * L : 0), hy = G.bottom(u) - 0.01 * L - (far ? 0.012 * L : 0);
    const ph = o.walk + i * 1.1 + (far ? Math.PI * 0.9 : 0);

    let fy = (far ? -0.014 * L : 0) - Math.max(0, Math.cos(ph)) * 0.035 * L * mv;

function drawGusokuImg(c, o, img){

  }
  dirtTimer -= dt; if (dirtTimer <= 0) { dirtTimer = rnd(120, 220); if (st.dirt.length < 8) st.dirt.push(mkDirt()); }
  if (mode === 'calm') {
    calmT += dt; calmAcc += dt;
    if (calmAcc >= 8) { calmAcc = 0; addExp(1); if (Math.random() < 0.25) st.aff = Math.min(100, st.aff + 1); if (Math.random() < 0.4) say(pick(['zzz…', '…', 'すぴー']), 2); }
    $('#calmTime').textContent = `${Math.floor(calmT / 60)}:${String(Math.floor(calmT % 60)).padStart(2, '0')}`;
  }
  hudTimer -= dt; if (hudTimer <= 0) { hudTimer = 1; st.maxFast = Math.max(st.maxFast, fastDays()); checkUnlocks(); hud(); }
  saveTimer -= dt; if (saveTimer <= 0) { saveTimer = 5; save(); }
}
function render(){
  const c = cx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.drawImage(bgC, 0, 0, W, H);
  drawRays(c);
  jellies.forEach(j => drawJelly(c, j));
  c.drawImage(decorC, 0, 0, W, H);
  drawDecorDyn(c);
  const ents = [];
  st.dirt.forEach(d => ents.push([d.d, () => drawDirt(c, d)]));
  st.shells.forEach(s => ents.push([s.d - 0.001, () => drawShell(c, s)]));
  foods.forEach(f => ents.push([f.landed ? f.d : 2, () => drawFood(c, f)]));
  ents.push([g.d, () => drawG(c)]);
  ents.sort((a, b) => a[0] - b[0]).forEach(e => e[1]());
  drawParticles(c);
  c.fillStyle = 'rgba(220,235,255,.45)';
  snow.forEach(s => { c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); });
  c.drawImage(vigC, 0, 0, W, H);
  if (calmDim > 0.01) { c.fillStyle = `rgba(0,6,18,${calmDim * 0.38})`; c.fillRect(0, 0, W, H); }
  drawSponge(c);
  drawBubble(c);
}

/* ---------- HUD ---------- */
function hud(){
  const L = lvOf(st.exp);
  $('#lvNum').textContent = L.lv;
  $('#ringFg').style.strokeDashoffset = (163.4 * (1 - L.cur / L.need)).toFixed(1);
  $('#expFill').style.width = (100 * L.cur / L.need).toFixed(1) + '%';
  $('#nameLbl').textContent = st.name;
  $('#stageLbl').textContent = st.molt ? '脱皮中…' : STAGE_NAME[st.stage];
  $('#coinNum').textContent = st.coins.toLocaleString('ja-JP');
  $('#affNum').textContent = Math.round(st.aff);
  $('#chipFast').textContent = fastText();
  $('#chipMood').textContent = moodText();
}
function fastText(){
  if (!st.lastFed) { const d = Math.floor((Date.now() - st.created) / DAY); return d >= 1 ? `絶食 ${d}日目` : 'ごはん まだ'; }
  const e = Date.now() - st.lastFed;
  if (e < HOUR) return `ごはん ${Math.max(1, Math.floor(e / MIN))}分前`;
  if (e < DAY) return `ごはん ${Math.floor(e / HOUR)}時間前`;
  return `絶食 ${Math.floor(e / DAY)}日目`;
}
function moodText(){
  if (g.mode === 'flip') return 'たいへん！';
  if (st.molt) return '脱皮中…';
  if (g.hideT > 0) return 'かくれてる';
  if (st.stress >= 50) return 'ちょっとピリピリ';
  if (st.dirt.length >= 5) return 'よごれが 気になる';
  if (st.lastFed && !hungry()) return 'おなかいっぱい';
  if (st.aff >= 80) return 'ごきげん';
  return 'のんびり';
}
const toastEl = $('#toast'), tq = []; let tbusy = false;
function toast(m){ tq.push(m); if (!tbusy) nextToast(); }
function nextToast(){
  const m = tq.shift(); if (!m) { tbusy = false; return; }
  tbusy = true; toastEl.textContent = m; toastEl.classList.add('show');
  setTimeout(() => { toastEl.classList.remove('show'); setTimeout(nextToast, 320); }, 2800);
}
function setMode(m){
  mode = m; app.dataset.mode = m;
  $('#actClean').classList.toggle('on', m === 'clean');
  $('#hint').hidden = m !== 'clean'; $('#calmBar').hidden = m !== 'calm'; $('#photoBar').hidden = m !== 'photo';
  if (m === 'calm') { calmT = 0; calmAcc = 0; $('#calmTime').textContent = '0:00'; }
  if (m !== 'clean') { scrub = null; sponge = null; }
}

/* ---------- シート ---------- */
const sheet = $('#sheet'), scrim = $('#scrim'), sheetBody = $('#sheetBody');
let sheetClose = null;
function openSheet(title, html, mount){
  clearTimeout(sheetClose);
  $('#sheetTitle').textContent = title; sheetBody.innerHTML = html; sheetBody.scrollTop = 0;
  scrim.hidden = false; sheet.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
  if (mount) mount(sheetBody);
}
function closeSheet(){
  sheet.classList.remove('open'); scrim.hidden = true;
  sheetClose = setTimeout(() => { sheet.hidden = true; sheetBody.innerHTML = ''; }, 260);
}
scrim.addEventListener('click', closeSheet); $('#sheetClose').addEventListener('click', closeSheet);

function openFood(){
  const full = !hungry(), left = full ? Math.ceil((FULL_MS - (Date.now() - st.lastFed)) / MIN) : 0;
  openSheet('エサをあげる', `
    <p class="lead">えらんだエサが ゆっくり しずんでいくよ。おなかが すいていれば 食べにくる。</p>
    <div class="foodgrid">${FOODS.map(f => `
      <button class="card foodcard" data-food="${f.id}" ${f.cost > st.coins ? 'disabled' : ''}>
        <span class="fimg">${foodIcon(f.id)}</span><b>${f.name}</b>
        <small>+${f.exp} EXP ・ ${f.cost ? `<span class="coinmark"></span>${f.cost}` : 'むりょう'}</small>
      </button>`).join('')}</div>
    <p class="state">${full ? `いまは おなかいっぱい（あと${left}分くらい）。しずめても 食べないかも` : 'おなかが すいているみたい'}</p>`,
    b => b.querySelectorAll('[data-food]').forEach(el => el.addEventListener('click', () => { closeSheet(); dropFood(el.dataset.food); })));
}
function thumbGusoku(cvEl, pal, vid, locked){
  const r = cvEl.getBoundingClientRect(), w = r.width || 100, h = r.height || 64, d = Math.min(2, devicePixelRatio || 1);
  cvEl.width = w * d; cvEl.height = h * d; const c = cvEl.getContext('2d'); c.scale(d, d);
  const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0c2a50'); gr.addColorStop(1, '#06142a');
  c.fillStyle = gr; rr(c, 0, 0, w, h, 10); c.fill();
  const has = !!IMG['gusoku_' + (st.stage + 1)];
  const L = w * (has ? 0.6 : 0.62), o = {x:w * (has ? 0.5 : 0.44), y:h * 0.84, L, dir:1, t:0, walk:0, moving:0, pal, vid:locked ? 'lock' : vid, noShadow:locked, noEye:locked};
  if (locked && !has) drawGusoku(c, o); else paintGusoku(c, o, has ? st.stage : Math.max(2, st.stage));
}
function openZukan(tab){
  tab = tab || 'kind';
  const lv = lvOf(st.exp).lv;
  const kind = `
    <p class="lead">あつめた すがた ${st.unlocked.length} / ${VARIANTS.length}　・　えらぶと すがたが かわるよ</p>
    <div class="zgrid">${VARIANTS.map(v => { const u = st.unlocked.includes(v.id);
      return `<button class="card zcard ${st.variant === v.id ? 'sel' : ''}" data-var="${v.id}" ${u ? '' : 'disabled'}>
        <canvas data-pal="${u ? v.id : 'lock'}" data-lock="${u ? 0 : 1}"></canvas><b>${u ? v.name : '？？？'}</b><small>${u ? (st.variant === v.id ? 'いまの すがた' : 'えらぶ') : v.cond}</small></button>`; }).join('')}</div>`;
  const tri = `<p class="lead">レベルが あがると ふえていく、グソクムシの ほんとうの話。</p>${TRIVIA.map(t => lv >= t.lv
    ? `<article class="card tri"><h3>${t.t}</h3><p>${t.b}</p></article>`
    : `<article class="card tri lock"><h3>？？？</h3><p>Lv.${t.lv} で ひらく</p></article>`).join('')}`;
  openSheet('ずかん', `<div class="tabs" role="tablist"><button role="tab" data-tab="kind" aria-selected="${tab === 'kind'}">すがた</button><button role="tab" data-tab="tri" aria-selected="${tab === 'tri'}">まめちしき</button></div>${tab === 'kind' ? kind : tri}`, b => {
    b.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => openZukan(el.dataset.tab)));
    requestAnimationFrame(() => b.querySelectorAll('canvas[data-pal]').forEach(el => thumbGusoku(el, PAL[el.dataset.pal], el.dataset.pal, el.dataset.lock === '1')));
    b.querySelectorAll('[data-var]').forEach(el => el.addEventListener('click', () => { st.variant = el.dataset.var; save(); openZukan('kind'); }));
  });
}
function openSumika(){
  openSheet('すみかの カスタマイズ', `
    <p class="lead">コインで 飾りを手に入れて、すみかを アレンジしよう。　<span class="coinmark"></span>${st.coins.toLocaleString('ja-JP')}</p>
    ${DECOR.map(d => { const own = st.owned.includes(d.id), on = st.placed.includes(d.id);
      return `<div class="card drow"><canvas data-dec="${d.id}"></canvas><div><b>${d.name}</b><small>${d.desc}</small></div>
        ${own ? `<button class="btn ${on ? '' : 'primary'}" data-place="${d.id}">${on ? 'しまう' : '置く'}</button>`
              : `<button class="btn primary" data-buy="${d.id}" ${d.price > st.coins ? 'disabled' : ''}><span class="coinmark"></span>${d.price}</button>`}</div>`; }).join('')}`, b => {
    requestAnimationFrame(() => b.querySelectorAll('canvas[data-dec]').forEach(el => {
      const d = Math.min(2, devicePixelRatio || 1), w = 96, h = 64; el.width = w * d; el.height = h * d;
      const c = el.getContext('2d'); c.scale(d, d);
      const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0c2a50'); gr.addColorStop(0.7, '#0a1f3d'); gr.addColorStop(0.7, '#162c50'); gr.addColorStop(1, '#0b1a33');
      c.fillStyle = gr; c.fillRect(0, 0, w, h);
      const sz = {cave:33, coral:30, lantern:11, whalebone:30, chimney:17, ship:30}[el.dataset.dec];
      const by = {cave:62, coral:58, lantern:54, whalebone:50, chimney:60, ship:52}[el.dataset.dec];
      drawDecor(c, el.dataset.dec, w / 2, by, sz, false);
    }));
    b.querySelectorAll('[data-buy]').forEach(el => el.addEventListener('click', () => {
      const d = DECOR.find(x => x.id === el.dataset.buy); if (d.price > st.coins) return;
      st.coins -= d.price; st.owned.push(d.id); st.placed.push(d.id); buildDecor(); save(); hud();
      toast(`「${d.name}」を すみかに置いた！`); openSumika();
    }));
    b.querySelectorAll('[data-place]').forEach(el => el.addEventListener('click', () => {
      const id = el.dataset.place;
      st.placed = st.placed.includes(id) ? st.placed.filter(x => x !== id) : st.placed.concat(id);
      if (id === 'cave' && !st.placed.includes('cave')) g.hideT = 0;
      buildDecor(); save(); openSumika();
    }));
  });
}
function openSettings(){
  const days = Math.max(1, Math.ceil((Date.now() - st.created) / DAY));
  openSheet('せってい', `
    <div class="field"><label for="setName">なまえ</label><div class="row"><input type="text" id="setName" maxlength="10" value="${esc(st.name)}"><button class="btn" id="saveName">変える</button></div></div>
    <div class="field"><span class="lab">きろく</span><dl class="stats">
      <div><dt>いっしょにいる日数</dt><dd>${days}日</dd></div><div><dt>脱皮</dt><dd>${st.molts}回</dd></div>
      <div><dt>いちばん長い絶食</dt><dd>${st.maxFast}日</dd></div><div><dt>おそうじ</dt><dd>${st.cleaned}回</dd></div>
      <div><dt>たすけた回数</dt><dd>${st.flips}回</dd></div><div><dt>なつき度</dt><dd>${Math.round(st.aff)}</dd></div></dl></div>
    <div class="field"><p class="lead" style="margin:0 0 8px">きろくは この端末のブラウザに 保存されます。</p>
      <button class="btn" id="resetBtn">データを 最初からにする</button>
      <div id="resetConfirm" hidden style="margin-top:12px"><p class="lead" style="margin:0 0 8px">いまの グソクムシとの きろくが すべて消えます。</p>
      <div class="row"><button class="btn warn" id="resetYes">消して はじめる</button><button class="btn" id="resetNo">やめる</button></div></div></div>`, b => {
    b.querySelector('#saveName').addEventListener('click', () => { const v = b.querySelector('#setName').value.trim(); if (v) { st.name = v.slice(0, 10); save(); hud(); toast(`なまえを「${st.name}」に したよ`); } });
    b.querySelector('#resetBtn').addEventListener('click', () => { b.querySelector('#resetConfirm').hidden = false; });
    b.querySelector('#resetNo').addEventListener('click', () => { b.querySelector('#resetConfirm').hidden = true; });
    b.querySelector('#resetYes').addEventListener('click', () => {
      const n = st.name; st = fresh(n); foods = []; g.mode = 'idle'; g.hideT = 0; g.food = null; buildDecor(); save(); hud(); closeSheet();
      toast(`あたらしい ${n}が やってきた`);
    });
  });
}
function composePhoto(){
  const y0 = Math.max(0, groundY - H * 0.42), y1 = Math.min(H, groundY + DR + H * 0.1);
  const sw = cv.width, sy = Math.round(y0 * DPR), sh = Math.round((y1 - y0) * DPR);
  const pad = Math.round(sw * 0.05), cap = Math.round(sw * 0.17);
  const pc = document.createElement('canvas'); pc.width = sw + pad * 2; pc.height = sh + pad + cap;
  const c = pc.getContext('2d');
  c.fillStyle = '#f6f3ec'; c.fillRect(0, 0, pc.width, pc.height);
  c.drawImage(cv, 0, sy, sw, sh, pad, pad, sw, sh);
  c.fillStyle = '#20324b'; c.font = `500 ${Math.round(sw * 0.055)}px "Kiwi Maru", sans-serif`; c.textBaseline = 'middle';
  c.fillText(`${st.name}　Lv.${lvOf(st.exp).lv}`, pad, pad + sh + cap * 0.5);
  const dt = new Date(), ds = `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, '0')}.${String(dt.getDate()).padStart(2, '0')}`;
  c.fillStyle = '#7a8699'; c.font = `500 ${Math.round(sw * 0.035)}px "Zen Maru Gothic", sans-serif`; c.textAlign = 'right';
  c.fillText(ds, pc.width - pad, pad + sh + cap * 0.5);
  try { return pc.toDataURL('image/jpeg', 0.9); } catch (e) { return null; }
}

/* ---------- 操作 ---------- */
function pt(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function hitG(p){ const L = gL() * dScale(g.d), cxx = gx(), cyy = gy() - L * 0.25; return ((p.x - cxx) / (L * 0.62)) ** 2 + ((p.y - cyy) / (L * 0.4)) ** 2 < 1; }
cv.addEventListener('pointerdown', e => {
  if (!started || mode === 'photo' || mode === 'calm') return;
  const p = pt(e);
  if (mode === 'clean') { scrub = {x:p.x, y:p.y}; sponge = p; rubAt(p.x, p.y, 26 * K); try { cv.setPointerCapture(e.pointerId); } catch (_) {} return; }
  const sh = st.shells.find(s => Math.hypot(s.x * W - p.x, (groundY + s.d * DR - 15 * K - p.y) * 1.3) < 0.08 * W);
  if (sh) { st.shells = st.shells.filter(s => s !== sh); st.coins += 15; floatText('+15', p.x, p.y - 10 * K, '#ffe08a'); sparkle(p.x, p.y, 8); toast('ぬけがらを ひろった（コイン +15）'); hud(); save(); return; }
  if (hitG(p)) { pet(); return; }
  if (st.dirt.some(d => Math.hypot(d.x * W - p.x, groundY + d.d * DR - p.y) < 0.07 * W)) toast('よごれは「おそうじ」で こすって落とせるよ');
});
cv.addEventListener('pointermove', e => {
  if (mode !== 'clean') return;
  const p = pt(e); sponge = p;
  if (scrub) { const d = Math.hypot(p.x - scrub.x, p.y - scrub.y); rubAt(p.x, p.y, d); scrub.x = p.x; scrub.y = p.y; }
});
const endScrub = e => { scrub = null; if (e.pointerType !== 'mouse') sponge = null; };
cv.addEventListener('pointerup', endScrub); cv.addEventListener('pointercancel', endScrub);
cv.addEventListener('pointerleave', () => { if (!scrub) sponge = null; });

$('#actFeed').addEventListener('click', () => { setMode('normal'); openFood(); });
$('#actClean').addEventListener('click', () => {
  if (mode === 'clean') { setMode('normal'); return; }
  setMode('clean');
  if (!st.dirt.length) toast('いまは よごれが ないみたい');
});
$('#hintDone').addEventListener('click', () => setMode('normal'));
$('#actPet').addEventListener('click', () => { setMode('normal'); pet(); });
$('#actCalm').addEventListener('click', () => setMode('calm'));
$('#calmEnd').addEventListener('click', () => {
  const m = Math.floor(calmT / 60); setMode('normal');
  if (calmT >= 20) toast(m >= 1 ? `${m}分 そっと見守った。${st.name}も おちついたみたい` : `${st.name}は おちついているみたい`);
});
$('#btnZukan').addEventListener('click', () => { setMode('normal'); openZukan('kind'); });
$('#btnSumika').addEventListener('click', () => { setMode('normal'); openSumika(); });
$('#btnSettings').addEventListener('click', () => { setMode('normal'); openSettings(); });
$('#btnCamera').addEventListener('click', () => setMode('photo'));
$('#photoClose').addEventListener('click', () => setMode('normal'));
$('#shutter').addEventListener('click', () => {
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  setTimeout(() => {
    const url = composePhoto();
    if (!url) { toast('しゃしんを つくれなかった。画像素材の置き場所を たしかめてね'); return; }
    openSheet('しゃしん', `<figure class="photo"><img src="${url}" alt="${esc(st.name)}の しゃしん"><figcaption>画像を 長押し（パソコンは 右クリック）で 保存できます</figcaption></figure>`);
  }, 120);
});

/* ---------- はじまり ---------- */
function applyOffline(){
  const el = Date.now() - st.lastSeen, msgs = [];
  if (el > 10 * MIN) {
    const nd = Math.max(0, Math.min(8 - st.dirt.length, Math.floor(el / (40 * MIN))));
    for (let i = 0; i < nd; i++) st.dirt.push(mkDirt());
    st.stress = 0;
    msgs.push(`おかえり！ ${fmtDur(el)}ぶり`);
    if (nd > 0) msgs.push(`よごれが ${nd}つ ふえてるよ`);
    if (st.lastFed && el > DAY) msgs.push(`${st.name}は ${fastDays()}日 なにも食べずに 元気にしてた`);
  } else msgs.push(`${st.name}が まってたよ`);
  msgs.forEach(toast);
}
function begin(isNew){
  if (isNew) { const n = $('#titleName').value.trim() || 'ぐそくん'; st = fresh(n.slice(0, 10)); clearSave(); }
  started = true; app.dataset.started = '1';
  $('#titleScreen').classList.add('hide'); setTimeout(() => { $('#titleScreen').hidden = true; }, 650);
  buildDecor(); g.hideT = 0; g.food = null; foods = [];
  if (isNew) { toast(`${st.name}が やってきた！`); toast('まずは「エサ」を あげてみよう'); flipTimer = 240; }
  else applyOffline();
  if (st.molt) g.mode = 'molt';
  hud(); save(); checkStage();
}
let restartArmed = false;
function showTitle(){
  const saved = loadSave();
  if (saved && saved.v === 1) {
    st = Object.assign(fresh(saved.name), saved);
    $('#newBox').hidden = true; $('#contMsg').hidden = false;
    $('#contMsg').innerHTML = `<b style="color:var(--ink)">${esc(st.name)}</b>（Lv.${lvOf(st.exp).lv}）が まってるよ`;
    $('#startBtn').textContent = 'つづきから'; $('#restartLink').hidden = false;
    $('#startBtn').onclick = () => begin(false);
    $('#restartLink').onclick = () => {
      if (!restartArmed) { restartArmed = true; $('#newBox').hidden = false; $('#contMsg').textContent = 'いまの きろくは消えます。なまえを決めて もう一度おしてね'; $('#restartLink').textContent = 'この なまえで はじめから'; return; }
      begin(true);
    };
  } else {
    $('#startBtn').onclick = () => begin(true);
  }
  buildDecor();
}
function boot(data){
  resize(); loadAssets();
  if (data && data.st) { st = data.st; started = !!data.started; }
  if (started) { app.dataset.started = '1'; $('#titleScreen').hidden = true; buildDecor(); hud(); }
  else showTitle();
  requestAnimationFrame(frame);
}
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(resize, 120); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
if (document.fonts && document.fonts.load) ['500 20px "Kiwi Maru"', '700 14px "Zen Maru Gothic"'].forEach(f => document.fonts.load(f).catch(() => {}));
window.claude?.hot?.snapshot?.(() => ({st, started}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
